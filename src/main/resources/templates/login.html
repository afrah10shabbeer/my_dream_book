<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="hero-wrapper">
        <!-- BG IMAGE -->
        <img th:src="@{/images/home_bg.jpg}" class="banner-img" alt="Banner">
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-semibold text-white" th:href="@{/my_dream_book/home}">
                    MyDreamBook
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link text-white"
                        th:href="@{/my_dream_book/dream_places}">
                        MY DREAM PLACES
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white"
                    th:href="@{/my_dream_book/add_dream_place}">
                    ADD A DREAM PLACE
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                th:href="@{/my_dream_book/favorites}">
                FAVORITES
            </a>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
        <a class="nav-link text-white"
        th:href="@{/my_dream_book/login}">
            LOGIN
        </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                class="nav-link text-white">
                LOGOUT
            </button>
        </form>
    </li>
    
</ul>

</div>
</div>
</nav>
<div class="login-page container mt-5">
    <h4>Login</h4>
    <form th:action="@{/my_dream_book/login}" method="post">
        
        <div class="alert alert-danger" th:if="${param.error}">
            Invalid username or password
        </div>
        
        <div class="alert alert-success" th:if="${param.logout}">
            Logged out successfully
        </div>
        
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-info w-100">
            Login
        </button>
        
    </form>
    <div class="text-center mt-3">
        <small class="text-white-50">
            Don't have an account?
            <a th:href="@{/my_dream_book/register}" class="text-info fw-semibold">
                Register here
            </a>
        </small>
    </div>
    
    
</div>
</body>
</html>
