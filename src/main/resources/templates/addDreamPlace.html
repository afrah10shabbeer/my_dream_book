<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AddDreamPlace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
</head>
<body>
    
    <div class="hero-wrapper">
        <img th:src="@{/images/bg_2.jpg}" class="banner-img" alt="Banner">
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-semibold text-white" th:href="@{/my_dream_book/home}">
                    MyDreamBook
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link text-white"
                        th:href="@{/my_dream_book/dream_places}">
                        MY DREAM PLACES
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white"
                    th:href="@{/my_dream_book/add_dream_place}">
                    ADD A DREAM PLACE
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                th:href="@{/my_dream_book/favorites}">
                FAVORITES
            </a>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
        <a class="nav-link text-white"
        th:href="@{/my_dream_book/login}">
            LOGIN
        </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                class="nav-link text-white">
                LOGOUT
            </button>
        </form>
    </li>
    
</ul>
</div>
</div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <h4 class="card-title mb-3">Add a Dream Place</h4>
            <div class="card shadow-sm card-style">
                <div class="card-body">
                    
                    
                    <form th:action="@{/save_update_card}" method="post" enctype="multipart/form-data">
                        
                        <!-- Title -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="title">Place Title</label>
                            <input type="text" id="title" name="title" class="form-control" required>
                        </div>
                        
                        <!-- Country -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="country">Country</label>
                            <input type="text" id="country" name="country" class="form-control" required>
                        </div>
                        
                        <!-- Google Maps Link -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="gmapsLink">Google Maps Link</label>
                            <input type="url" id="gmapsLink" name="gmapsLink" 
                            class="form-control" 
                            placeholder="https://maps.google.com/..." required>
                        </div>
                        
                        <!-- Image Upload -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="image">Upload Image</label>
                            <input class="form-control" type="file" id="image" name="image" accept="image/*">
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">
                                Category
                            </label>
                            
                            <select id="category" name="category" class="form-select" required>
                                <option value="" disabled selected>Choose a category</option>
                                <option value="Travel">✈️ Travel</option>
                                <option value="Adventure">⛰️ Adventure</option>
                                <option value="Nature">🌿 Nature</option>
                                <option value="View">🌅 View</option>
                                <option value="Train">🚆 Train</option>
                                <option value="Beach">🏖️ Beach</option>
                                <option value="Mountain">🏔️ Mountain</option>
                                <option value="Play">🎡 Play</option>
                                <option value="Food">🍽️ Food</option>
                                <option value="City">🏙️ City</option>
                                <option value="Stuff">🧰 Stuff</option>
                                <option value="Relax">🧘 Relax</option>
                            </select>
                        </div>
                        
                        
                        <button type="submit" class="btn btn-primary w-100 button-style">
                            Add Dream Place
                        </button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
