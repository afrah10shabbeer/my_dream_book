<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyDreamBook</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
    <div class="hero-wrapper">
        <!-- BG IMAGE -->
        <img th:src="@{/images/home_bg.jpg}" class="banner-img" alt="Banner">
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-semibold text-white" th:href="@{/my_dream_book/home}">
                    MyDreamBook
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link text-white"
                        th:href="@{/my_dream_book/dream_places}">
                        MY DREAM PLACES
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white"
                    th:href="@{/my_dream_book/add_dream_place}">
                    ADD A DREAM PLACE
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                th:href="@{/my_dream_book/favorites}">
                FAVORITES
            </a>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
        <a class="nav-link text-white"
        th:href="@{/my_dream_book/login}">
            LOGIN
        </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                class="nav-link text-white">
                LOGOUT
            </button>
        </form>
    </li>
    
</ul>
</div>
</div>
</nav>

<!-- HERO SECTION -->
<section class="hero-section">
    
    <!-- TEXT BELOW BANNER -->
    <div class="hero-content container text-center">
        <h1 class="hero-title">
            Travel is the only thing you buy that makes you richer
        </h1>
        
        <p class="hero-subtitle mt-3">
            Capture your dream destinations.<br>
            One place, one story, one lifetime.
        </p>
        
        <div class="mt-4">
            <a th:href="@{/my_dream_book/dream_places}" class="btn btn-primary btn-lg me-2 button-style">
                View My Dream Places
            </a>
            <a th:href="@{/my_dream_book/add_dream_place}" class="btn btn-outline-primary btn-lg button-style">
                Add a New Dream
            </a>
        </div>
    </div>
    
</section>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
