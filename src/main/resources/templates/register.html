<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="hero-wrapper">
        <!-- BG IMAGE -->
        <img th:src="@{/images/home_bg.jpg}" class="banner-img" alt="Banner">
        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-semibold text-white" th:href="@{/my_dream_book/home}">
                    MyDreamBook
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link text-white"
                        th:href="@{/my_dream_book/dream_places}">
                        MY DREAM PLACES
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white"
                    th:href="@{/my_dream_book/add_dream_place}">
                    ADD A DREAM PLACE
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white"
                th:href="@{/my_dream_book/favorites}">
                FAVORITES
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white"
            th:href="@{/my_dream_book/login}">
            LOGIN
        </a>
    </li>
</ul>
</div>
</div>
</nav>
<div class="login-page container mt-5">
    <h4>Register</h4>
    <form th:action="@{/my_dream_book/register}" method="post">
        
        <!-- ERROR MESSAGE -->
        <div class="alert alert-danger"
        th:if="${error}"
        th:text="${error}">
        </div>
    
        <!-- SUCCESS MESSAGE -->
        <div class="alert alert-success"
        th:if="${success}"
        th:text="${success}">
        </div>
    <div class="mb-3">
        <label>Username</label>
        <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-info w-100">
        Register
    </button>

</form>
<div class="text-center mt-3">
    <small class="text-white-50">
        Have an account?
        <a th:href="@{/my_dream_book/login}" class="text-info fw-semibold">
            Login here
        </a>
    </small>
</div>

</div>
</body>
</html>
